name: P03-T01 Integrated Acceptance

on:
  push:
    branches: [agent/p03-t01-validation-resume]
    paths:
      - 'frontend/**'
      - '.github/workflows/p03-t01-acceptance.yml'
      - '.github/scripts/p03-t01-check.mjs'

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build frontend
        run: |
          corepack enable pnpm
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build
      - name: Start preview
        run: |
          pnpm --dir frontend preview --host 127.0.0.1 >/tmp/preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4321/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/preview.log; exit 1
      - name: Install browser harness
        run: npm install playwright-core@1.55.0
      - name: Browser acceptance
        run: |
          mkdir -p /tmp/screens
          node .github/scripts/p03-t01-check.mjs
      - name: Upload source-width screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p03-source-width-screenshots
          path: /tmp/screens/*.png
          if-no-files-found: warn
