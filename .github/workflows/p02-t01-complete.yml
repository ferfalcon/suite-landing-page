name: Complete P02-T01

on:
  push:
    branches:
      - agent/p02-t01-upper-page
    paths:
      - '.github/workflows/p02-t01-complete.yml'

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Complete task with exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          node docs/implementation-workflow/cli/design-workflow.mjs context --json
          node docs/implementation-workflow/cli/design-workflow.mjs task complete P02-T01 --commit "$head_sha"
          node docs/implementation-workflow/cli/design-workflow.mjs context --json
          node docs/implementation-workflow/cli/design-workflow.mjs validate
          node docs/implementation-workflow/cli/design-workflow.mjs sync --check
      - name: Commit canonical workflow state
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No workflow state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete P02-T01 workflow state"
          git push
